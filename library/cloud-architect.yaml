# Resume Forge example: the banner layout. Band with a pattern (or a photo),
# portrait over the band's edge, pill headings, icon tiles in the side column,
# a trivia card, roles as role + "company > team (dates)" + bullets, prose side
# projects. Everyone and everything in this file is fictional.
resume:
  meta:
    title: Cloud platform engineer (banner)
  basics:
    name: Marina Costa
    title: Cloud Platform Engineer
    location: Lisbon, Portugal
    email: marina@example.com
    website: https://marina.example.dev
    links:                    # typed once; the "Socials" icon row below mirrors them (source: basics)
      - label: Website
        url: https://marina.example.dev
        icon: globe
      - label: Mastodon
        url: https://mastodon.social/@marinacosta
      - label: GitHub
        url: https://github.com/marinacosta
      - label: dev.to
        url: https://dev.to/marinacosta
      - label: LinkedIn
        url: https://www.linkedin.com/in/marina-costa
  sections:
    - type: text
      title: Profile
      zone: main
      text: |-
        I build the paved road: clusters, pipelines and guardrails that let product teams ship without opening a ticket.

        Eight years across fintech and logistics platforms, mostly Kubernetes, Terraform and GitLab CI, with a soft spot for boring, well-documented infrastructure.

        These days I read as many dashboards as I write modules, looking for the next piece of toil worth deleting.
    - type: experience
      title: Recent experience
      zone: main
      items:
        - role: Platform Engineering Lead
          company: Fabrikam Logistics
          team: Developer Platform
          start: Jan 2024
          end: Present
          highlights:
            - Own the internal developer platform behind 40 services; deploy frequency doubled in a year.
            - Replaced a hand-rolled release process with shared GitLab CI templates; failed deploys fell by two thirds.
            - Run the on-call rotation and the monthly game day; mentor three engineers.
        - role: Senior Cloud Engineer
          company: Fabrikam Logistics
          team: Core Infrastructure
          start: Jun 2021
          end: Dec 2023
          highlights:
            - Migrated 120 workloads from a datacenter to EKS with no customer-visible downtime.
            - Wrote the Terraform modules and the review standard the company still uses.
            - Cut the monthly cloud bill by 28% through right-sizing and spot node groups.
            - Introduced SLOs for the twelve busiest services and the error budget policy that goes with them.
        - role: Cloud Engineer
          company: Woodgrove Payments
          team: Payments Infrastructure
          start: Mar 2018
          end: May 2021
          highlights:
            - Built the PCI network segmentation and the pipeline that produces its audit evidence.
    - type: text
      title: Side projects
      zone: main
      text: |-
        I write a monthly newsletter on platform engineering (about 1,200 readers) and publish the Terraform snippets behind each issue as [open source](https://github.com/marinacosta).

        On weekends I maintain a [bike-route planner](https://marina.example.dev/routes) for the Lisbon coast, mostly as an excuse to play with map tiles.
    - type: iconrow
      title: Socials
      zone: aside
      source: basics          # the tiles are basics.links; no second list to keep in sync
    - type: iconrow
      title: Badges
      zone: aside
      items:
        - label: Credly
          url: https://www.credly.com/users/marinacosta
        - label: Kubernetes
          icon: kubernetes
        - label: Hack The Box
          url: https://app.hackthebox.com/users/marinacosta
    - type: iconrow
      title: Main hobbies
      zone: aside
      items:
        - label: Cycling
          icon: bike
        - label: Photography
          icon: camera
        - label: Board games
          icon: dice
        - label: Coffee
          icon: coffee
        - label: Books
          icon: book
    - type: iconrow
      title: Secondary hobbies
      zone: aside
      items:
        - label: Music
          icon: music
        - label: Hiking
          icon: map
        - label: Cooking
          icon: utensils
        - label: Plants
          icon: leaf
    - type: list
      title: Trivia
      zone: aside
      style: card
      items:
        - text: Portuguese, based in Lisbon
          icon: pin
        - text: Has run the same 10k loop every Sunday since 2019
        - text: Learned Kubernetes on a cluster of three thrift-store laptops
        - text: Will defend tabs over spaces for one minute, then change the subject
  design:
    template: banner
    palette: navy
    fonts: modern
    headings: pill
    icons: tiles
    bullet: ✦
    links: none               # the links live in the side column, not beside the name
    photo:
      shape: circle
      size: lg
      ring: true
    banner:
      shape: flat
      height: normal
      pattern: blueprint
    columns:
      side: left
      width: 36
